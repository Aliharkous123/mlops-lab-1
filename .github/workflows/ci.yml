
name: Food11 CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check code quality
        run: uv run --no-sync ruff check src tests

      - name: Run tests
        run: uv run --no-sync python -m pytest -q

  smoke:
    name: smoke
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t food11-ci-test .

      - name: Start API container
        run: docker run -d --name food11-smoke -p 8000:8000 -e SKIP_MODEL=1 food11-ci-test

      - name: Check health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --noproxy '*' http://127.0.0.1:8000/health; then
              echo "Smoke test passed!"
              exit 0
            fi
            sleep 2
          done
          docker logs food11-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f food11-smoke || true

  push:
    name: push
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/aliharkous123/mlops-lab-1:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
